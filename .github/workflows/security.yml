name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - name: Validate pinned GitHub Actions workflows
        run: |
          node ops/ci/check-action-pins.mjs .github/workflows/*.yml
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color .github/workflows/*.yml
      - name: Validate bounded security exceptions
        run: ruby ops/ci/check-trivy-exceptions.rb ops/security/trivyignore.yaml
      - run: pnpm install --frozen-lockfile
      - name: Reject high or critical production dependency advisories
        run: pnpm audit --prod --audit-level high
      - name: Enforce production dependency license policy
        shell: bash
        run: |
          set -euo pipefail
          pnpm licenses list --prod --json > "$RUNNER_TEMP/xcs-licenses.json"
          node ops/ci/check-licenses.mjs \
            "$RUNNER_TEMP/xcs-licenses.json" \
            ops/security/license-overrides.json
  repository-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan vulnerabilities, secrets and deployment misconfiguration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
          version: v0.72.0
          trivy-config: ops/security/trivy.yaml
      - name: Generate the source SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          path: .
          format: spdx-json
          output-file: xcs-source.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: xcs-source-sbom
          path: xcs-source.spdx.json
          if-no-files-found: error
          retention-days: 30
