start:
  args:
    - reader-node
    - merger
  flags:
    reader-node-path: /app/firexrpl
    reader-node-arguments: "fetch rpc 0 --state-dir /data/poller --endpoints https://s.altnet.rippletest.net:51234/ --latest-block-retry-interval 2s"
    common-merged-blocks-store-url: /data/merged-blocks
    common-one-block-store-url: /data/one-blocks
    common-first-streamable-block: 0
